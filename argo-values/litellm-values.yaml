masterKey:
  secretName: litellm-master-key-secret
  secretKey: master-key

database:
  writer:
    host: postgresql.postgres.svc.cluster.local
    port: 5432
    dbname: litellm
    passwordSecret:
      name: litellm-db-secret
      usernameKey: username
      passwordKey: password

gateway:
  replicaCount: 1
  extraEnv:
    - name: MLFLOW_TRACKING_URI
      value: "http://mlflow.mlflow.svc.cluster.local:5000"
  config:
    create: true
    proxy_config:
      litellm_settings:
        success_callback:
          - mlflow
        failure_callback:
          - mlflow

service:
  type: ClusterIP
