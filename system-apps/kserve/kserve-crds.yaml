apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-crd
      targetRevision: v0.20.0
      helm:
        releaseName: kserve-crd
    # Keep both charts in one Application: each renders the shared
    # ClusterStorageContainer CRD, which must have a single Argo CD owner.
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-llmisvc-crd
      targetRevision: v0.20.0
      helm:
        releaseName: kserve-llmisvc-crd
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
