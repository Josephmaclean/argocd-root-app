apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-resources
      targetRevision: v0.20.0
      helm:
        releaseName: kserve
        valueFiles:
          - $values/argo-values/kserve-values.yaml
    - repoURL: https://github.com/Josephmaclean/argocd-root-app
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  # The storage-initializer memory limit (storageInitializer.memoryLimit in the
  # inferenceservice-config ConfigMap) is hardcoded to 1Gi by the kserve-resources
  # chart and is NOT exposed as a Helm value. 1Gi OOMKills large HuggingFace
  # downloads (hf_transfer/xet buffering) for LLMInferenceService, whose
  # controller also ignores ClusterStorageContainer overrides (kserve#5480).
  # We raise it to 6Gi out-of-band and tell Argo CD to stop reverting that one
  # field so self-heal does not fight the change.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: inferenceservice-config
      namespace: kserve
      jsonPointers:
        - /data/storageInitializer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
